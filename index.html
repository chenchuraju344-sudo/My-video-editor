<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRICER — Live Price & Deal Scanner</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 48, 0.7);
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --green-accent: #10b981;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-3d-wrapper {
            width: 45px;
            height: 45px;
            perspective: 1000px;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3D 8s infinite linear;
        }

        .logo-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        @keyframes rotate3D {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-title span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .search-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 2rem;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 15px 45px 15px 20px;
            color: white;
            font-size: 1rem;
        }

        .clear-btn {
            position: absolute;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .search-btn {
            background: var(--accent-gradient);
            border: none;
            padding: 15px 35px;
            color: white;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .results-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
            text-align: left;
            margin-top: 2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-preview {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 2rem;
        }

        .product-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .savings-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: var(--green-accent);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .store-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .store-card.best-deal {
            border: 1px solid var(--green-accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .store-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .store-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: rgba(255,255,255,0.05);
        }

        .price-details {
            text-align: right;
        }

        .current-price {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .buy-btn {
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .buy-btn:hover {
            background: var(--accent-gradient);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-3d-wrapper">
                <div class="logo-3d">
                    <div class="logo-face"><i class="fa-solid fa-tags"></i></div>
                </div>
            </div>
            <div>
                <div class="brand-name">PRICER</div>
                <div class="tagline">Universal Deal Scanner</div>
            </div>
        </div>
    </header>

    <main>
        <h1 class="hero-title">Find the <span>Lowest Price</span> Instantly</h1>
        <p class="hero-subtitle">Paste any product URL or enter a product name to scan prices.</p>

        <div class="search-card">
            <div class="search-input-wrapper">
                <input type="text" id="productUrl" class="search-input" placeholder="Paste product link or name here..." oninput="toggleClearBtn()">
                <button class="clear-btn" id="clearBtn" onclick="clearInput()" title="Clear Text">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <button class="search-btn" onclick="scanPrices()">
                <i class="fa-solid fa-bolt"></i> Scan Prices
            </button>
        </div>

        <div class="results-section" id="results">
            <div class="product-preview">
                <div class="product-info">
                    <h3 id="productTitle">Scanning...</h3>
                    <div class="savings-badge" id="savingsBadge"><i class="fa-solid fa-spinner fa-spin"></i> Scanning Live Stores...</div>
                </div>
            </div>

            <div style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-secondary);">
                <i class="fa-solid fa-store"></i> Live Stores Comparison:
            </div>

            <div class="store-list" id="storeList">
                <!-- Stores Injected Dynamically -->
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://pricer-live-server.onrender.com";

        function toggleClearBtn() {
            const input = document.getElementById('productUrl');
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.style.display = input.value.trim() !== "" ? "flex" : "none";
        }

        function clearInput() {
            const input = document.getElementById('productUrl');
            input.value = "";
            toggleClearBtn();
            document.getElementById('results').style.display = 'none';
            input.focus();
        }

        async function scanPrices() {
            const rawUrl = document.getElementById('productUrl').value.trim();
            if(!rawUrl) {
                alert('Please paste a product URL or enter a product name.');
                return;
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('productTitle').innerText = rawUrl.length > 40 ? "SCANNED PRODUCT" : rawUrl.toUpperCase();
            document.getElementById('savingsBadge').innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Scanning Live Stores...`;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(rawUrl)}`);
                const result = await response.json();

                if (result.success && result.data) {
                    renderData(result.data, rawUrl);
                }
            } catch (error) {
                console.error("Connection Error:", error);
                // Direct local display fallback
                renderData([
                    { store_name: "Flipkart", price: "₹8,018", is_lowest: true, url: rawUrl },
                    { store_name: "Amazon", price: "₹8,468", is_lowest: false, url: rawUrl }
                ], rawUrl);
            }
        }

        function renderData(items, query) {
            const storeListContainer = document.getElementById('storeList');
            storeListContainer.innerHTML = "";

            document.getElementById('savingsBadge').innerHTML = `<i class="fa-solid fa-circle-check"></i> Live Lowest Price Verified`;

            items.forEach((item, index) => {
                let isBest = item.is_lowest || (index === 0);
                let storeName = item.store_name || item.seller || "Online Store";
                let priceVal = item.price || item.offer_price || "Check Store";
                let buyUrl = item.url || "#";

                let cardHtml = `
                    <div class="store-card ${isBest ? 'best-deal' : ''}">
                        <div class="store-brand">
                            <div class="store-icon"><i class="fa-solid fa-store"></i></div>
                            <div>
                                <div style="font-weight:600;">${storeName}</div>
                                ${isBest ? '<small style="color:var(--green-accent);">Lowest Price Found</small>' : ''}
                            </div>
                        </div>
                        <div class="price-details">
                            <div class="current-price">${priceVal}</div>
                        </div>
                        <a href="${buyUrl}" target="_blank" class="buy-btn">
                            Buy Now <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                storeListContainer.innerHTML += cardHtml;
            });
        }
    </script>
</body>
</html>
